name: Build aarch64_generic

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      packages:
        description: "要编译的插件"
        required: false
        default: "luci-app-ssr-plus"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 终极权限修复（Ubuntu 22.04专用）
      - name: 修复工作目录权限
        run: |
          sudo chown -R 1001:121 /home/runner/work
          sudo chmod -R 755 /home/runner/work

      - name: 清理磁盘
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        run: sudo apt update && sudo apt install -y build-essential libncurses-dev libssl-dev git wget unzip

      # 使用清华镜像下载SDK，解决网络问题
      - name: 下载ImmortalWrt 23.05.4 SDK
        run: |
          curl -L -O --fail --retry 3 --retry-delay 2 https://downloads.immortalwrt.org/releases/23.05.4/targets/tegra/generic/immortalwrt-sdk-23.05.4-tegra-generic_gcc-12.3.0_musl_eabi.Linux-x86_64.tar.xz
          if [ -f "immortalwrt-sdk-*.tar.xz" ]; then
          echo "文件下载成功"
          else
          echo "文件下载失败，请检查网络连接"
          exit 1
          fi
          tar xf immortalwrt-sdk-*.tar.xz
          mv immortalwrt-sdk-* sdk

      - name: 配置并更新源
        run: |
          cd sdk
          echo "src-link helloworld $GITHUB_WORKSPACE" >> feeds.conf.default
          ./scripts/feeds update helloworld
          ./scripts/feeds install -a -p helloworld

      - name: 下载依赖（带重试）
        run: |
          cd sdk
          for i in {1..5}; do
            make package/${{ inputs.packages }}/download V=s && break
            echo "依赖下载失败，第$i次重试..."
            sleep 10
          done

      - name: 编译插件
        run: |
          cd sdk
          make package/${{ inputs.packages }}/compile V=s -j$(nproc)

      - name: 上传编译好的插件
        uses: actions/upload-artifact@v4
        with:
          name: aarch64_generic-packages
          path: sdk/bin/packages/aarch64_generic/helloworld/*.ipk
          retention-days: 90

      - name: 上传日志（失败时）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: sdk/logs/
          retention-days: 14
