name: Build aarch64_generic

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      packages:
        description: "要编译的插件"
        required: false
        default: "luci-app-ssr-plus"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TERM: xterm

    steps:
      - uses: actions/checkout@v4

      - name: 清理磁盘
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true

      - name: 安装依赖
        run: sudo apt update && sudo apt install -y build-essential libncurses-dev libssl-dev git wget unzip bzip2

      - name: 下载 SDK
        run: |
          aria2c -x 3 https://downloads.immortalwrt.org/releases/23.05.4/targets/tegra/generic/immortalwrt-sdk-23.05.4-tegra-generic_gcc-12.3.0_musl_eabi.Linux-x86_64.tar.xz
          mkdir -p sdk
          tar -xJf immortalwrt-sdk-*.tar.xz --strip-components=1 -C sdk

      - name: 完整更新所有 feeds（必须！解决 luci.mk 缺失）
        run: |
          cd sdk
          echo "src-git helloworld https://github.com/fw876/helloworld" >> feeds.conf.default
          
          # 关键：必须更新所有基础源（luci、packages 等）
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cd sdk
          make defconfig

      - name: 下载依赖
        run: |
          cd sdk
          make package/${{ inputs.packages }}/download V=s

      - name: 编译插件
        run: |
          cd sdk
          make package/${{ inputs.packages }}/compile V=s -j$(nproc)
       jobs:
         build:
         timeout-minutes: 240  # 4小时
         runs-on: ubuntu-latest

      - name: 上传插件
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: sdk/bin/packages/*/helloworld/*.ipk
          retention-days: 90
