name: Build aarch64_generic

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      packages:
        description: "要编译的插件"
        required: false
        default: "luci-app-ssr-plus"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # 关键修复：指定环境变量，解决终端问题
    env:
      TERM: xterm
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - uses: actions/checkout@v4

      - name: 清理磁盘
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true

      - name: 安装依赖
        run: sudo apt update && sudo apt install -y build-essential libncurses-dev libssl-dev git wget unzip bzip2 p7zip

      - name: 下载 SDK
        run: |
          aria2c -x 3 https://downloads.immortalwrt.org/releases/23.05.4/targets/tegra/generic/immortalwrt-sdk-23.05.4-tegra-generic_gcc-12.3.0_musl_eabi.Linux-x86_64.tar.xz
          mkdir -p sdk
          tar -xJf immortalwrt-sdk-*.tar.xz --strip-components=1 -C sdk

      - name: 配置插件源
        run: |
          cd sdk
          echo "src-git helloworld https://github.com/fw876/helloworld" >> feeds.conf.default
          ./scripts/feeds clean
          ./scripts/feeds update helloworld
          ./scripts/feeds install -a -p helloworld

      # 核心修复：避免自动运行 menuconfig
      - name: 生成默认配置
        run: |
          cd sdk
          make defconfig
          
      - name: 下载依赖
        run: |
          cd sdk
          make package/${{ inputs.packages }}/download V=s

      - name: 编译插件
        run: |
          cd sdk
          make package/${{ inputs.packages }}/compile V=s -j1

      - name: 上传插件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-packages
          path: sdk/bin/packages/*/helloworld/*.ipk
          retention-days: 90
