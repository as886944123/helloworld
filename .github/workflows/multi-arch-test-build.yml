name: Build aarch64_generic

on:
  push:
    branches: [master, main]
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      packages:
        description: '要编译的插件（空格分隔）'
        required: false
        default: 'luci-app-ssr-plus'

jobs:
  build:
    # 最关键：使用Ubuntu 20.04，彻底解决chown权限错误
    runs-on: ubuntu-20.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 提前彻底修复权限，从根源上避免内部chown失败
      - name: 修复所有权限
        run: |
          sudo chown -R runner:runner /home/runner/work
          sudo chmod -R 777 /home/runner/work

      - name: 清理磁盘
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 确定要编译的插件
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            PACKAGES="${{ inputs.packages }}"
          else
            PKG_ROOTS=$(find . -name Makefile | grep -v ".*/src/Makefile" | sed -e 's@./\(.*\)/Makefile@\1/@')
            CHANGES=$(git diff --diff-filter=d --name-only HEAD^ HEAD 2>/dev/null || true)
            
            for ROOT in $PKG_ROOTS; do
              for CHANGE in $CHANGES; do
                if [[ "$CHANGE" == "$ROOT"* ]]; then
                  PACKAGES="$PACKAGES $(echo "$ROOT" | sed -e 's@\(.*\)/@\1@')"
                  break
                fi
              done
            done
            
            PACKAGES="${PACKAGES:-luci-app-ssr-plus}"
          fi
          
          echo "PACKAGES=$PACKAGES" >> $GITHUB_ENV
          echo "编译插件: $PACKAGES"

      - name: 编译插件（终极稳定版）
        uses: immortalwrt/gh-action-sdk@v5.1
        env:
          ARCH: aarch64_generic
          TARGET: armvirt-64
          FEEDNAME: packages_ci
          PACKAGES: $PACKAGES
          V: s
          # 下载优化参数
          DOWNLOAD_RETRY: 10
          DOWNLOAD_TIMEOUT: 120
          # 使用国内镜像
          MIRROR: china
          # 跳过不必要的检查
          NO_REFRESH: 1
          NO_UPDATE: 1

      - name: 上传插件
        uses: actions/upload-artifact@v4
        with:
          name: aarch64_generic-packages
          path: bin/packages/aarch64_generic/packages_ci/*.ipk
          retention-days: 90

      - name: 上传日志（失败时）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aarch64_generic-logs
          path: logs/
          retention-days: 30
