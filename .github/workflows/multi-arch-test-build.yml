name: Build armv8
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "插件名"
        required: false
        default: "luci-app-ssr-plus"
        
# 强制 Node.js 24，彻底消除弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_NO_WARNINGS: 1              # 屏蔽所有 Node 内部警告
  ACTIONS_JOIN_MULTILINE_BYTES: 1
  
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    
    steps:
      - uses: actions/checkout@v4.3.0

      #- name: 清理磁盘
        #uses: jlumbroso/free-disk-space@main

      #- name: 安装依赖
        #run: sudo apt update && sudo apt install -y build-essential libncurses-dev git wget unzip aria2

      - name: 下载SDK
        run: |
          aria2c -x 8 https://downloads.immortalwrt.org/releases/24.10.1/targets/armsr/armv8/immortalwrt-sdk-24.10.1-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          mkdir sdk && tar --zstd -xf immortalwrt-sdk-*.tar.zst --strip-components=1 -C sdk

      - name: 安装 feeds
        run: |
          cd sdk
          echo "src-git helloworld https://github.com/fw876/helloworld" >> feeds.conf.default
          ./scripts/feeds update -a && ./scripts/feeds install -a
          make defconfig

      - name: 编译
        run: |
          cd sdk
          make package/${{ inputs.packages }}/download V=s -j$(nproc)
          make package/${{ inputs.packages }}/compile V=s -j$(nproc)

      - name: 上传插件
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ inputs.packages }}
          path: "sdk/**/*.ipk"
