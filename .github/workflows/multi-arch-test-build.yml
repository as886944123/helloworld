name: Test Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm_cortex-a9_vfpv3-d16
            target: mvebu-cortexa9
          - arch: mips_24kc
            target: ath79-generic
          - arch: mipsel_24kc
            target: mt7621
          - arch: aarch64_cortex-a53
            target: mvebu-cortexa53
          - arch: arm_cortex-a15_neon-vfpv4
            target: armvirt-32
          - arch: i386_pentium-mmx
            target: x86-geode
          - arch: x86_64
            target: x86-64

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch name
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH="${GITHUB_BASE_REF#refs/heads/}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "Building for $BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Determine changed packages
        run: |
          PKG_ROOTS=$(find . -name Makefile | \
            grep -v ".*/src/Makefile" | \
            sed -e 's@./\(.*\)/Makefile@\1/@')
          
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/${BRANCH}"
          else
            BASE_REF="HEAD^"
          fi
          
          CHANGES=$(git diff --diff-filter=d --name-only $BASE_REF HEAD || true)

          PACKAGES=""
          for ROOT in $PKG_ROOTS; do
            for CHANGE in $CHANGES; do
              if [[ "$CHANGE" == "$ROOT"* ]]; then
                PACKAGE_NAME=$(echo "$ROOT" | sed -e 's@\(.*\)/@\1@')
                PACKAGES="$PACKAGES $PACKAGE_NAME"
                break
              fi
            done
          done
          
          PACKAGES="${PACKAGES:-luci-app-ssr-plus}"
          PACKAGES=$(echo $PACKAGES | xargs)

          echo "Building packages: $PACKAGES"
          echo "PACKAGES=$PACKAGES" >> $GITHUB_ENV

      - name: Build
        uses: immortalwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: packages_ci
          V: s
          TARGET: ${{ matrix.target }}
          PACKAGES: ${{ env.PACKAGES }}

      - name: Move packages
        run: cp -f bin/packages/${{ matrix.arch }}/packages_ci/*.ipk . 2>/dev/null || true

      - name: Generate metadata
        run: |
          MERGE_ID=$(git rev-parse --short HEAD)
          
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_ID=$(git rev-parse --short origin/$BRANCH 2>/dev/null || echo "unknown")
            HEAD_ID=$(git rev-parse --short HEAD)
            PRNUMBER=${GITHUB_REF_NAME%/merge}
          else
            BASE_ID=$(git rev-parse --short HEAD^ 2>/dev/null || echo "unknown")
            HEAD_ID=$MERGE_ID
            PRNUMBER="push-$MERGE_ID"
          fi
          
          ARCHIVE_NAME=${{ matrix.arch }}-$PRNUMBER
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          
          shopt -s nullglob
          IPKS=( *.ipk )
          
          cat << EOF > PKG-INFO
          Metadata-Version: 2.1
          Name: $ARCHIVE_NAME
          Version: $BRANCH
          Author: $GITHUB_ACTOR
          Home-page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          Download-URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Summary: $PACKAGES
          Platform: ${{ matrix.arch }}

          Packages for ImmortalWrt $BRANCH on ${{ matrix.arch }}, built from $PRNUMBER
          Commit: $HEAD_ID, Base: $BASE_ID

          Modified packages:
          EOF
          
          for p in $PACKAGES; do echo "  - $p" >> PKG-INFO; done
          echo -e "\nPackage count: ${#IPKS[@]}" >> PKG-INFO
          echo "Package sizes:" >> PKG-INFO
          for f in "${IPKS[@]}"; do du -sh "$f" >> PKG-INFO; done
          [ ${#IPKS[@]} -eq 0 ] && echo "No packages built." >> PKG-INFO
          cat PKG-INFO

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-packages
          path: |
            Packages
            Packages.*
            *.ipk
            PKG-INFO

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-logs
          path: |
            logs/
            PKG-INFO
