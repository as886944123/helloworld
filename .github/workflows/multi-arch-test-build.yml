name: Build aarch64_generic

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      packages:
        description: "要编译的插件"
        required: false
        default: "luci-app-ssr-plus"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 清理磁盘
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        run: sudo apt update && sudo apt install -y build-essential libncurses-dev libssl-dev git wget unzip

      - name: 下载并正确解压 SDK
        run: |
          aria2c -x 3 https://downloads.immortalwrt.org/releases/23.05.4/targets/tegra/generic/immortalwrt-sdk-23.05.4-tegra-generic_gcc-12.3.0_musl_eabi.Linux-x86_64.tar.xz
          
          # 【正确解压】直接解压到 sdk 目录，不产生嵌套
          mkdir -p sdk
          tar -xJf immortalwrt-sdk-*.tar.xz --strip-components=1 -C sdk

      - name: 配置 feeds（无循环、无嵌套）
        run: |
          cd sdk
          # 【关键修复】使用 src-git 方式，不会产生文件系统循环
          echo "src-git helloworld https://github.com/fw876/helloworld" >> feeds.conf.default
          
          ./scripts/feeds clean
          ./scripts/feeds update helloworld
          ./scripts/feeds install -a -p helloworld

      - name: 下载依赖
        run: |
          cd sdk
          make package/${{ inputs.packages }}/download V=s

      - name: 编译插件
        run: |
          cd sdk
          make package/${{ inputs.packages }}/compile V=s -j$(nproc)

      - name: 上传编译好的插件
        uses: actions/upload-artifact@v4
        with:
          name: aarch64_generic-packages
          path: sdk/bin/packages/*/helloworld/*.ipk
          retention-days: 90

      - name: 上传日志（失败时）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: sdk/logs/
          retention-days: 14
