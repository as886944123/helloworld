name: Build aarch64_generic

on:
  push:
    branches: [master, main]
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      packages:
        description: '要编译的插件（空格分隔）'
        required: false
        default: 'luci-app-ssr-plus'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 第一步：彻底修复权限问题（最关键）
      - name: 修复工作目录权限
        run: |
          sudo chown -R runner:runner $GITHUB_WORKSPACE
          sudo chmod -R 755 $GITHUB_WORKSPACE

      - name: 清理磁盘
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true

      - name: 确定要编译的插件
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            PACKAGES="${{ inputs.packages }}"
          else
            # 自动检测修改的插件
            PKG_ROOTS=$(find . -name Makefile | grep -v ".*/src/Makefile" | sed -e 's@./\(.*\)/Makefile@\1/@')
            CHANGES=$(git diff --diff-filter=d --name-only HEAD^ HEAD 2>/dev/null || true)
            
            for ROOT in $PKG_ROOTS; do
              for CHANGE in $CHANGES; do
                if [[ "$CHANGE" == "$ROOT"* ]]; then
                  PACKAGES="$PACKAGES $(echo "$ROOT" | sed -e 's@\(.*\)/@\1@')"
                  break
                fi
              done
            done
            
            PACKAGES="${PACKAGES:-luci-app-ssr-plus}"
          fi
          
          echo "PACKAGES=$PACKAGES" >> $GITHUB_ENV
          echo "编译插件: $PACKAGES"

      - name: 编译插件（专门针对helloworld优化）
        uses: immortalwrt/gh-action-sdk@v6
        env:
          ARCH: aarch64_generic
          TARGET: armvirt-64
          FEEDNAME: packages_ci
          PACKAGES: $PACKAGES
          V: s
          # 增加下载重试次数和超时时间
          DOWNLOAD_RETRY: 5
          DOWNLOAD_TIMEOUT: 60
          # 使用国内镜像源加速
          MIRROR: china
        continue-on-error: true

      # 失败时自动重试一次下载
      - name: 重试编译（失败时）
        if: failure()
        uses: immortalwrt/gh-action-sdk@v6
        env:
          ARCH: aarch64_generic
          TARGET: armvirt-64
          FEEDNAME: packages_ci
          PACKAGES: $PACKAGES
          V: s
          DOWNLOAD_RETRY: 10
          DOWNLOAD_TIMEOUT: 120
          MIRROR: china

      - name: 上传插件
        uses: actions/upload-artifact@v4
        with:
          name: aarch64_generic-packages
          path: bin/packages/aarch64_generic/packages_ci/*.ipk
          retention-days: 90

      - name: 上传日志（失败时）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aarch64_generic-logs
          path: logs/
          retention-days: 30
